<!DOCTYPE html>
<html lang="en" style="margin:0;padding:0;">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Kart World Open Interactive Map - normal-platinum.github.io</title>
  <link rel="icon" type="image/png" href="Icons/YVM_Icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</head>
<body style="margin:0;padding:0;">
  <div id="map" style="width:100vw;height: 100vh;"></div>
</body>
<script>
  //init map
  var map = L.map('map', {
    crs: L.CRS.Simple,
    center: [0,0],
    zoom: -1,
    minZoom: -2,
    maxZoom: 4,
  });
  var bounds = [[1110,-1217],[-1195,1243]];
  var bgMap = L.imageOverlay('Maps/Full_Map_L1.png',bounds).addTo(map);
  var noRoadsMap = L.imageOverlay('Maps/World_Map_(NoIcons).png',bounds);
  var trafficMap = L.imageOverlay('Maps/Traffic_Map.png',bounds);
  map.setMaxBounds(bounds.map(c => c.map(x => x * 1.2)));
  
  //grab data.json
  async function loadDataJSON() {try {
    const response = await fetch('.obsidian/plugins/obsidian-leaflet-plugin/data.json');
    if (!response.ok) {throw new Error('HTTP error when fetching data.json');}
    return await response.json();
  } catch (error) {
    console.error('Could not load data.json:', error);
  }}
  
  //icons and layerGroups
  var driveThrus = L.layerGroup([]);
  var foodTrucks = L.layerGroup([]);
  var snackBars = L.layerGroup([]);
  const yoshisIcon = L.icon({
    iconUrl: 'Icons/Yoshis_Icon.png',
    iconSize: [24,24],
    alt: "Yoshi's Restaurant"
  });
  var vendingMachines = L.layerGroup([]);
  const yvmIcon = L.icon({
    iconUrl: 'Icons/YVM_Icon.png',
    iconSize: [24,24],
    alt: "Yoshi's Vending Machine"
  });
  var foodStalls = L.layerGroup([]);
  const foodIcon = L.icon({
    iconUrl: 'Icons/Dash_Food_Icon.png',
    iconSize: [24,24],
    alt: "Dash Food Stall"
  });
  var pSwitches = L.layerGroup([]);
  const pSwitchIcon = L.icon({
    iconUrl: 'Icons/P_Switch_Icon.png',
    iconSize: [24,24],
    alt: "P Switch Mission"
  });
  var medallions = L.layerGroup([]);
  const medallionIcon = L.icon({
    iconUrl: 'Icons/Medallion_Icon.png',
    iconSize: [24,24],
    alt: "Peach Medallion"
  });
  var panels = L.layerGroup([]);
  const panelIcon = L.icon({
    iconUrl: 'Icons/?_Panel_Icon.png',
    iconSize: [24,24],
    alt: "? Panel"
  });
  var travelPoints = L.layerGroup([]);
  const travelIcon = L.icon({
    iconUrl: 'Icons/Travel_Icon.png',
    iconSize: [24,24],
    alt: "Fast Travel Destination Point"
  });
  var trainStations = L.layerGroup([]);
  const trainIcon = L.icon({
    iconUrl: 'Icons/Train_Icon.png',
    iconSize: [24,24],
    alt: "Train Station"
  });
  var miscLayer = L.layerGroup([]);
  
  //layer controls
  const baseLayers = {
    "Road Map": bgMap,
    "World Map": noRoadsMap,
  }
  const overlays = {
    "Traffic Map": trafficMap,
    "Yoshi's Drive-throughs": driveThrus,
    "Yoshi's Food Trucks": foodTrucks,
    "Yoshi's Snack Bars": snackBars,
    "Yoshi's Vending Machines": vendingMachines,
    "Independent Food Stalls": foodStalls,
    "P Switch Missions": pSwitches,
    "Peach Medallions": medallions,
    "? Panels": panels,
    "Fast Travel Points": travelPoints,
    "Train Stations": trainStations,
    "Miscellaneous": miscLayer,
  }
  const layercontrol = L.control.layers(baseLayers, overlays).addTo(map);
  
  //funcs
  function myPopup(desc,type,file) {//returns stringified html element
    let image = ""
    if (file!=undefined) {image = '<img src="Screenshots/'+type+'/'+file+'" width="240" height="135">'}
    if (desc == null) {desc = ""}
    return '<p>'+desc+'</p>'+image;};

  function myIcon(type) {//returns icon
    if (type == "Yoshi's") {return yoshisIcon}
    if (type == "Vending Machine") {return yvmIcon}
    if (type == "Dash Food") {return foodIcon}
    if (type == "P Switch") {return pSwitchIcon}
    if (type == "Peach Medallion") {return medallionIcon}
    if (type == "? Panel") {return panelIcon}
    if (type == "Fast Travel") {return travelIcon}
    if (type == "Train Station") {return trainIcon}
    return new L.Icon.Default;
  }

  function myGroup(file,type) {//returns layerGroup
    if (type == "Yoshi's") {
      let t; try {t = String(file).match(/(?:MKW.)(\w+)/)[1]} catch {console.error('No file found, setting layerGroup to miscLayer')}
      if (t == "YDT") {return driveThrus}
      if (t == "YFT") {return foodTrucks}
      if (t == "YSB") {return snackBars}}
    if (type == "Vending Machine") {return vendingMachines}
    if (type == "Dash Food") {return foodStalls}
    if (type == "P Switch") {return pSwitches}
    if (type == "Peach Medallion") {return medallions}
    if (type == "? Panel") {return panels}
    if (type == "Fast Travel") {return travelPoints}
    if (type == "Train Station") {return trainStations}
    return miscLayer;
  }
  
  //async stuff
  loadDataJSON().then(result => {
    const JSONmarkers = result.mapMarkers[0].markers;
    const JSONicons = result.markerIcons;
    //console.log(JSONmarkers)
    for (let i = 0; i < JSONmarkers.length; i++) {
      L.marker(JSONmarkers[i].loc)
        .setIcon(myIcon(JSONmarkers[i].type))
        .bindPopup(myPopup(JSONmarkers[i].description,JSONmarkers[i].type,JSONmarkers[i].link))
        .addTo(myGroup(JSONmarkers[i].link,JSONmarkers[i].type));}

    for (let i = 1; i < Object.keys(overlays).length -1; i++) {
      if (Object.values(overlays)[i].getLayers().length != 0) {
        Object.values(overlays)[i].addTo(map);}}
  })
</script>
