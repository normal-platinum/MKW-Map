<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</head>
<body>
  <div id="map" style="width:99vw;height: 98vh;"></div>
</body>
<script>
  //init map
  var map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 4
  });
  var bounds = [[1110,-1217],[-1195,1243]];
  var image = L.imageOverlay('Maps/Full_Map_L1.png',bounds).addTo(map);
  map.fitBounds(bounds);
  
  //grab data.json
  async function loadDataJSON() {try {
    const response = await fetch('.obsidian/plugins/obsidian-leaflet-plugin/data.json');
    if (!response.ok) {throw new Error('HTTP error when fetching data.json');}
    return await response.json();
  } catch (error) {
    console.error('Could not load data.json:', error);
  }}
  
  //icons
  var isMobile;
  try {isMobile = navigator.userAgentData.mobile;} 
  catch (error) {console.error('Loading desktop site,', error);
    isMobile = false;}
  const yoshisIcon = L.icon({
    iconUrl: 'Icons/Yoshis_Icon.png',
    iconSize: isMobile ? [48, 48] : [24,24],
    alt: "Yoshi's Restaurant"
  });
  const yvmIcon = L.icon({
    iconUrl: 'Icons/YVM_Icon.png',
    iconSize: isMobile ? [48, 48] : [24,24],
    alt: "Yoshi's Vending Machine"
  });
  const pSwitchIcon = L.icon({
    iconUrl: 'Icons/P_Switch_Icon.png',
    iconSize: isMobile ? [48, 48] : [24,24],
    alt: "P Switch Mission"
  });
  const trainIcon = L.icon({
    iconUrl: 'Icons/Train_Icon.png',
    iconSize: isMobile ? [48, 48] : [24,24],
    alt: "Train Station"
  });
  
  //funcs
  function myPopup(desc,file) {
    return desc+'<br><br><img src="Screenshots/'+file+'" width="240" height="135">';};
  function myIcon(type) {
    if (type == "Yoshi's") {return yoshisIcon}
    if (type == "Vending Machine") {return yvmIcon}
    if (type == "P Switch") {return pSwitchIcon}
    if (type == "Train Station") {return trainIcon}
  }
  
  //async stuff
  loadDataJSON().then(result => {
    const JSONmarkers = result.mapMarkers[0].markers;
    const JSONicons = result.markerIcons;
    console.log(JSONmarkers)
    for (let i = 0; i < JSONmarkers.length; i++) {
      L.marker(JSONmarkers[i].loc)
        .setIcon(myIcon(JSONmarkers[i].type))
        .bindPopup(myPopup(JSONmarkers[i].description,"Yoshi's/"+JSONmarkers[i].link))
        .addTo(map);
    }
  })
</script>
